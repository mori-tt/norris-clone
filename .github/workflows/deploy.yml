name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (static export with /norris-clone base path)
        run: npm run build
        env:
          BASE_PATH: /norris-clone
          # canonical/hreflang/sitemap の正規化先。独自ドメイン取得後は
          # リポジトリ変数 SITE_URL を Settings > Variables に登録する
          SITE_URL: ${{ vars.SITE_URL || 'https://mori-tt.github.io/norris-clone' }}

      - name: Prefix raw absolute paths in exported HTML/CSS
        run: node scripts/fix-base-path.mjs out /norris-clone

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # デプロイ直後はCDN伝播遅延で一時的に404が返る。主要URLが200になるまで
      # ポーリングして「実際に見えるようになったか」をワークフロー結果で確認する。
      # タイムアウトしても警告のみ(デプロイ自体は成功済み)。
      - name: Wait for Pages CDN propagation
        run: |
          for i in $(seq 1 30); do
            ok=1
            for u in "/" "/en/" "/zh/" "/images/norris/logo.png"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://mori-tt.github.io/norris-clone$u")
              echo "check $u -> $code"
              [ "$code" = "200" ] || ok=0
            done
            [ "$ok" = "1" ] && echo "All checks passed - site is live" && exit 0
            sleep 10
          done
          echo "::warning::CDN propagation check timed out (site may take a few more minutes to be fully visible)"
          exit 0
